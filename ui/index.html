<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhFlow — FDA Regulatory Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="header-inner">
        <span class="logo">PhFlow</span>
        <span class="subtitle">21 CFR Parts 210 &amp; 211 &mdash; Dock-to-Stock GMP Assistant</span>
      </div>
    </header>

    <main id="chat-container">
      <div id="messages">
        <!-- Welcome block -->
        <div id="welcome" class="welcome">
          <h2 class="welcome-title">What can I help you with?</h2>
          <p class="welcome-desc">
            Ask about receiving, quarantine, storage, temperature control, labeling,
            or any GMP requirement under 21&nbsp;CFR Parts&nbsp;210&nbsp;&amp;&nbsp;211.
          </p>
          <div class="suggestions">
            <button class="chip" data-q="What should I do if a shipment arrives with a broken seal?">Broken seal on shipment</button>
            <button class="chip" data-q="Do I need to quarantine temperature-sensitive materials on arrival?">Quarantine temp-sensitive materials</button>
            <button class="chip" data-q="What are the storage requirements for components under GMP?">Component storage requirements</button>
            <button class="chip" data-q="A material was left out of cold storage overnight. What now?">Material left out of cold storage</button>
            <button class="chip" data-q="Who is responsible for approving received materials?">Who approves received materials?</button>
            <button class="chip" data-q="What documentation is required when receiving a shipment?">Receiving documentation</button>
          </div>
        </div>
      </div>
    </main>

    <footer id="input-area">
      <div class="input-inner">
        <textarea
          id="user-input"
          placeholder="Ask about warehouse GMP requirements..."
          rows="1"
          autofocus
        ></textarea>
        <button id="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
