services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334

  # llama.cpp is run as a native binary, not a Docker service.
  # Start it manually before launching the API:
  #
  #   llama-server -m /path/to/model.gguf -c 32768 --port 8080
  #
  # Download a GGUF model (e.g. Llama-3.1-8B-Instruct-Q4_K_M.gguf) from:
  #   https://huggingface.co/bartowski/Meta-Llama-3.1-8B-Instruct-GGUF
  #
  # Install llama.cpp:
  #   brew install llama.cpp          # macOS
  #   pip install llama-cpp-python    # Python bindings (optional)
  #   # or build from source: https://github.com/ggerganov/llama.cpp
