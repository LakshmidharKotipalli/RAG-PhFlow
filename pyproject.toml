[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phflow"
version = "0.1.0"
description = "RAG application for FDA Title 21 CFR regulatory intelligence"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ingestion = [
    "lxml>=5.0",
    "sentence-transformers>=3.0",
    "fastembed>=0.4",
    "qdrant-client>=1.9",
    "tiktoken>=0.7",
    "tqdm>=4.66",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "fastembed>=0.4",
    "tiktoken>=0.7",
    "transformers>=4.40",
    "torch>=2.0",
]
ui = [
    "chainlit>=1.2",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]
all = [
    "phflow[ingestion,api,ui,dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
